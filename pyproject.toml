[project]
name = "packferry"
version = "0.1.0"
description = "Offline PyPI/npm collection and audited Nexus delivery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
  "httpx==0.28.1", "packaging==26.3", "typer==0.15.4",
  "sqlalchemy==2.0.41", "alembic==1.15.2", "python-multipart==0.0.20",
  "pyyaml==6.0.2", "platformdirs==4.3.8", "pip==25.1.1", "uv==0.11.29",
  "twine==7.0.0",
]

[project.optional-dependencies]
desktop = ["pywebview==6.0", "PySide6==6.9.0; sys_platform == 'linux'"]
build = ["pyinstaller==6.13.0"]

[project.scripts]
packferry = "apps.exporter.cli:main"
packferry-import = "clients.importer_cli.__main__:main"
packferry-desktop = "apps.exporter.desktop:main"

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.10"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages", "clients"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110
